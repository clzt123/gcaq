# ==========================================
# SafeGuard-AI — Milvus 本地向量数据库
# ==========================================
# Milvus 2.4+ standalone 模式内嵌 etcd + minio，无需额外依赖。
#
# 启动命令:
#   docker compose -f docker-compose.milvus.yml up -d
#
# 验证:
#   docker compose -f docker-compose.milvus.yml logs milvus
#   curl http://localhost:9091/healthz
# ==========================================

version: "3.8"

services:
  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: safeguard-milvus
    restart: unless-stopped
    ports:
      - "19530:19530"   # gRPC（SDK 连接）
      - "9091:9091"     # HTTP 管理接口
    environment:
      # Standalone 模式（默认），内嵌 etcd + minio
      - ETCD_USE_EMBED=true
      - ETCD_DATA_DIR=/var/lib/milvus/etcd
      - MINIO_USE_EMBED=true
      - MINIO_DATA_DIR=/var/lib/milvus/minio
      - COMMON_STORAGETYPE=local
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    command: ["milvus", "run", "standalone"]

volumes:
  milvus_data:
    name: safeguard-milvus-data
