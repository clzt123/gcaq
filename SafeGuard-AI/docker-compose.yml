# ==========================================
# SafeGuard-AI (安卫智脑) — 全栈生产部署
# ==========================================
# 一键启动 Neo4j + Redis + Milvus + FastAPI 全栈服务。
#
# 快速开始:
#   1. cp .env.example .env  &&  编辑 .env 填入密码和 API Key
#   2. docker compose up -d
#   3. docker compose ps    # 确认 4 个服务均为 healthy
#
# 仅启动基础设施（不含 API）:
#   docker compose up -d neo4j redis milvus
#
# 数据导入（首次部署）:
#   docker compose run --rm safeguard-api python scripts/init_neo4j.py
#
# 验证:
#   docker compose logs -f safeguard-api
#   curl http://localhost:8000/health    # API 健康检查
#   curl http://localhost:8000/docs      # Swagger 文档
#   curl http://localhost:7474           # Neo4j Browser
#   docker exec safeguard-redis redis-cli ping   # 应返回 PONG
#   curl http://localhost:9091/healthz   # Milvus 健康检查
#
# 停止:
#   docker compose down                 # 保留数据卷
#   docker compose down -v              # 删除全部数据（⚠️ 不可逆）
# ==========================================

services:
  # ====================
  # Neo4j 图数据库
  # ====================
  neo4j:
    image: neo4j:latest
    container_name: safeguard-neo4j
    restart: unless-stopped
    networks:
      - safeguard-network
    ports:
      - "7474:7474"       # HTTP (Neo4j Browser)
      - "${NEO4J_BOLT_PORT:-17687}:7687"   # Bolt (应用连接)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-safeguard-change-me}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=256m
      - NEO4J_server_directories_import=/
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./mock_data:/var/lib/neo4j/import
    healthcheck:
      test:
        - CMD-SHELL
        - >
          cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-safeguard-change-me}
          'RETURN 1' || exit 1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ====================
  # Redis 缓存
  # ====================
  redis:
    image: redis:7-alpine
    container_name: safeguard-redis
    restart: unless-stopped
    networks:
      - safeguard-network
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ====================
  # Milvus 向量数据库
  # ====================
  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: safeguard-milvus
    restart: unless-stopped
    networks:
      - safeguard-network
    ports:
      - "${MILVUS_GRPC_PORT:-19530}:19530"   # gRPC (SDK 连接)
      - "${MILVUS_HTTP_PORT:-9091}:9091"     # HTTP 管理接口
    environment:
      - ETCD_USE_EMBED=true
      - ETCD_DATA_DIR=/var/lib/milvus/etcd
      - MINIO_USE_EMBED=true
      - MINIO_DATA_DIR=/var/lib/milvus/minio
      - COMMON_STORAGETYPE=local
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    command: ["milvus", "run", "standalone"]

  # ====================
  # FastAPI 应用 — SafeGuard-AI 核心服务
  # ====================
  safeguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safeguard-api
    restart: unless-stopped
    networks:
      - safeguard-network
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    # ---- 开发模式（热重载）----
    # 取消以下注释以启用代码热重载，本地修改即刻生效：
    # volumes:
    #   - ./app:/app/app:ro
    #   - ./mock_data:/app/mock_data:ro
    # command: >
    #   uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # ---- 生产模式（默认）----
    # 生产环境使用镜像内置代码，无需卷挂载
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"
          || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# ====================
# 网络
# ====================
networks:
  safeguard-network:
    name: safeguard-network
    driver: bridge

# ====================
# 数据卷（持久化）
# ====================
volumes:
  neo4j_data:
    name: safeguard-neo4j-data
  neo4j_logs:
    name: safeguard-neo4j-logs
  redis_data:
    name: safeguard-redis-data
  milvus_data:
    name: safeguard-milvus-data
