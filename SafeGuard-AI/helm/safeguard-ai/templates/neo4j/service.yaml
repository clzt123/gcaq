apiVersion: v1
kind: Service
metadata:
  name: {{ include "safeguard.neo4j.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "safeguard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
      protocol: TCP
    - name: http
      port: 7474
      targetPort: 7474
      protocol: TCP
  selector:
    app: {{ include "safeguard.neo4j.fullname" . }}
