apiVersion: v1
kind: Service
metadata:
  name: {{ include "safeguard.milvus.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "safeguard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 19530
      targetPort: 19530
      protocol: TCP
    - name: http
      port: 9091
      targetPort: 9091
      protocol: TCP
  selector:
    app: {{ include "safeguard.milvus.fullname" . }}
