{{- if and .Values.edge.enabled .Values.edge.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "safeguard.edge.fullname" . }}-hpa
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "safeguard.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "safeguard.edge.fullname" . }}
  minReplicas: {{ .Values.edge.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.edge.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.edge.autoscaling.targetCPUUtilization }}
{{- end }}
