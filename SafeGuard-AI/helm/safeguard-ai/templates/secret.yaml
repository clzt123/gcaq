apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "safeguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | required "secrets.llmApiKey is required" | quote }}
  DASHSCOPE_API_KEY: {{ .Values.secrets.dashscopeApiKey | quote }}
  NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | required "secrets.neo4jPassword is required" | quote }}
  LANGSMITH_API_KEY: {{ .Values.secrets.langsmithApiKey | quote }}
